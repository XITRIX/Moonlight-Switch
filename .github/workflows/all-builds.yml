name: All Builds

on:
  push:
    branches: [ master ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:

jobs:
  switch:
    name: Switch
    uses: ./.github/workflows/switch.yml

  psvita:
    name: PS Vita
    uses: ./.github/workflows/psvita.yml

  android:
    name: Android
    uses: ./.github/workflows/android-apk.yml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/macos.yml

  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [switch, psvita, android, macos, ios, windows, linux]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
