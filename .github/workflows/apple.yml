name: Apple Builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos
            artifact: Moonlight-macOS-arm64
            package: dist/Moonlight-macOS-arm64.zip
            log_platform: macOS
          - name: iOS arm64 (unsigned)
            platform: ios
            artifact: Moonlight-iOS-arm64-unsigned
            package: dist/Moonlight-iOS-arm64-unsigned.ipa
            log_platform: iOS

    env:
      APPLE_PLATFORM: ${{ matrix.platform }}
      BUILD_DIR: build/${{ matrix.platform }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Fetch vcpkg history and baseline
      shell: bash
      run: |
        manifest="vcpkg.json"
        baseline="$(sed -nE 's/.*"builtin-baseline":[[:space:]]*"([0-9a-f]{40})".*/\1/p' "${manifest}" | head -n1)"

        if [ -z "${baseline}" ]; then
          echo "Unable to determine vcpkg builtin-baseline from ${manifest}"
          exit 1
        fi

        if git -C extern/vcpkg rev-parse --is-shallow-repository | grep -q true; then
          git -C extern/vcpkg fetch --force --prune --tags --unshallow origin \
            "+refs/heads/*:refs/remotes/origin/*"
        else
          git -C extern/vcpkg fetch --force --prune --tags origin \
            "+refs/heads/*:refs/remotes/origin/*"
        fi

        if ! git -C extern/vcpkg cat-file -e "${baseline}^{commit}" 2>/dev/null; then
          git -C extern/vcpkg fetch --force origin "${baseline}"
        fi

        git -C extern/vcpkg cat-file -e "${baseline}^{commit}"

    - name: Install native build tools
      shell: bash
      run: |
        brew install nasm
        nasm -v

    - name: Build libromfs generator
      shell: bash
      run: |
        chmod +x build_libromfs_generator.sh
        ./build_libromfs_generator.sh

    - name: Bootstrap vcpkg
      shell: bash
      working-directory: extern/vcpkg
      run: |
        chmod +x bootstrap-vcpkg.sh
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Compute vcpkg cache key
      id: vcpkg-cache-key
      shell: bash
      run: |
        vcpkg_revision="$(git -C extern/vcpkg rev-parse HEAD)"
        manifest_hash="${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'extern/cmake/vcpkg-triplets/arm64-ios.cmake', 'extern/cmake/vcpkg-triplets/arm64-osx.cmake', 'extern/cmake/ios.toolchain.cmake') }}"
        if [[ "$APPLE_PLATFORM" == ios ]]; then
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          prefix="iOS-arm64-vcpkg-${sdk_version}-${vcpkg_revision}"
          xcodebuild -version
        else
          prefix="macOS-arm64-vcpkg-${vcpkg_revision}"
        fi
        echo "key=${prefix}-${manifest_hash}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-" >> "$GITHUB_OUTPUT"

    - name: Restore vcpkg cache
      uses: actions/cache@v6
      with:
        path: |
          extern/vcpkg/buildtrees
          extern/vcpkg/downloads
          extern/vcpkg/packages
          ${{ env.BUILD_DIR }}/vcpkg_installed
        key: ${{ steps.vcpkg-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.vcpkg-cache-key.outputs.restore-prefix }}

    - name: Configure
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        cmake -B build/macos \
          -DPLATFORM_DESKTOP=ON \
          -DBUNDLE_MACOS_APP=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=arm64-osx \
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/extern/cmake/vcpkg-triplets"

    - name: Build app bundle
      if: matrix.platform == 'macos'
      shell: bash
      run: cmake --build build/macos --config Release --parallel 3

    - name: Sign and validate app bundle
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        app="build/macos/Moonlight.app"

        test -d "$app"
        test -x "$app/Contents/MacOS/Moonlight"
        plutil -lint "$app/Contents/Info.plist"
        codesign --force --deep --sign - "$app"
        codesign --verify --deep --strict "$app"

    - name: Package app bundle
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        mkdir -p dist
        ditto -c -k --sequesterRsrc --keepParent \
          build/macos/Moonlight.app \
          dist/Moonlight-macOS-arm64.zip

    - name: Configure unsigned iOS device build
      if: matrix.platform == 'ios'
      shell: bash
      run: |
        cmake -B build/ios -G Xcode \
          -DPLATFORM_IOS=ON \
          -DAPPLE_MOBILE_SDK_VARIANT=DEVICE \
          -DCMAKE_BUILD_TYPE=Release \
          -DIOS_CODE_SIGN_IDENTITY= \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBROMFS_PREBUILT_GENERATOR="$GITHUB_WORKSPACE/libromfs-generator"

    - name: Build unsigned app bundle
      if: matrix.platform == 'ios'
      shell: bash
      run: |
        cmake --build build/ios --config Release --parallel 3 -- \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=

    - name: Validate and package unsigned IPA
      if: matrix.platform == 'ios'
      shell: bash
      run: |
        set -euo pipefail
        app="build/ios/Release-iphoneos/Moonlight.app"
        test -x "$app/Moonlight"
        test ! -f "$app/embedded.mobileprovision"
        plutil -lint "$app/Info.plist"
        test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$app/Info.plist")" = iPhoneOS
        test "$(lipo -archs "$app/Moonlight")" = arm64
        mkdir -p dist/Payload
        ditto "$app" dist/Payload/Moonlight.app
        (cd dist && zip -qry Moonlight-iOS-arm64-unsigned.ipa Payload)
        unzip -tq dist/Moonlight-iOS-arm64-unsigned.ipa

    - name: Upload Apple build logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-${{ matrix.log_platform }}-build-logs
        path: |
          ${{ env.BUILD_DIR }}/vcpkg-manifest-install*.log
          ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
          ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
          ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
          extern/vcpkg/buildtrees/**/*.log
        if-no-files-found: ignore

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.package }}
        if-no-files-found: error
